name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" \
            | tar -xz
          "shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "shellcheck-${SHELLCHECK_VERSION}/shellcheck" install.sh
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "${ACTIONLINT_VERSION}"
          ./actionlint
      - name: Everything stays ASCII
        # Printable ASCII plus tab and newline. A stray en dash or smart quote from a copy-paste breaks terminals and diffs for no benefit.
        run: |
          set -euo pipefail
          if LC_ALL=C grep -rnP '[^\x09\x0A\x20-\x7E]' \
               --include='*.sh' --include='*.yml' --include='*.yaml' \
               --include='*.bats' --include='*.md' .; then
            echo "::error::Non-ASCII characters found in the files listed above."
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        env:
          BATS_VERSION: v1.14.0
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${BATS_VERSION}" \
            https://github.com/bats-core/bats-core.git "${RUNNER_TEMP}/bats"
          echo "${RUNNER_TEMP}/bats/bin" >> "${GITHUB_PATH}"
      - run: bats --print-output-on-failure tests/

  # Runners that have a native build. Nothing else is installed on them, which is the point: the native distribution must not need Java.
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, macos-latest, windows-latest ]
        version: [ "latest", "0.16.0" ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: The native build was chosen and the versions agree
        shell: bash
        env:
          DIST: ${{ steps.setup.outputs.distribution }}
          RESOLVED: ${{ steps.setup.outputs.version }}
          REQUESTED: ${{ matrix.version }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$DIST" = "native"
          test "$CACHE_HIT" = "false"
          vulnlog --version | grep -F "$RESOLVED"
          if [ "$REQUESTED" != "latest" ]; then
            test "$RESOLVED" = "$REQUESTED"
          fi

      - id: again
        uses: ./
        with:
          version: ${{ steps.setup.outputs.version }}

      - name: A second use in the same job costs nothing
        shell: bash
        env:
          CACHE_HIT: ${{ steps.again.outputs.cache-hit }}
        run: test "$CACHE_HIT" = "true"

      # The assertion that catches a Windows path written in msys form: pwsh resolves PATH the way the runner set it, not the way bash sees it.
      - name: The binary resolves outside bash too
        if: runner.os == 'Windows'
        shell: pwsh
        run: vulnlog --version

      - name: It actually works on a fixture
        shell: bash
        run: vulnlog validate --strict tests/fixtures/vulnlog.yaml

  # Runners with no native build must fall back to the JVM distribution.
  jvm:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm  # linux/arm64
          - macos-15-intel    # macOS Intel x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - id: setup
        uses: ./

      - name: The JVM build was chosen and runs
        shell: bash
        env:
          DIST: ${{ steps.setup.outputs.distribution }}
          RESOLVED: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          test "$DIST" = "jvm"
          vulnlog --version | grep -F "$RESOLVED"
          vulnlog validate --strict tests/fixtures/vulnlog.yaml

  # Every documented failure mode should fail with our message, not a stack trace or a silent success.
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: missing-version
        continue-on-error: true
        uses: ./
        with:
          version: "99.99.99"

      - name: An unknown version fails the step
        env:
          OUTCOME: ${{ steps.missing-version.outcome }}
        run: test "$OUTCOME" = "failure"

      - id: tagform
        uses: ./
        with:
          version: "v0.17.0"

      - name: A leading v is accepted and normalised away
        env:
          RESOLVED: ${{ steps.tagform.outputs.version }}
        run: test "$RESOLVED" = "0.17.0"

  # Cheap, no runner matrix, and it fails before your users do.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every platform in the mapping table has a published asset
        run: |
          set -euo pipefail
          source ./install.sh
          latest="$(resolve_latest_version "$REPO")"
          for version in "$latest" 0.16.0; do
            # The JVM asset is the fallback for every platform without a
            # native build, so it has to exist too.
            assets="$(jvm_asset_name "$version")"
            for pair in "Linux X64" "macOS ARM64" "Windows X64"; do
              # shellcheck disable=SC2086
              set -- $pair
              assets="$assets $(native_asset_name "$(platform_slug "$1" "$2")")"
            done
            for asset in $assets; do
              url="$(download_url "$REPO" "$version" "$asset")"
              if ! curl -sfIL -o /dev/null "$url"; then
                echo "::error::Release v$version publishes no asset named $asset"
                exit 1
              fi
              echo "ok: v$version $asset"
            done
          done
